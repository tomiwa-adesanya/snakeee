[project]
name = "snakeee"
version = "0.1.0"
description = "LAN multiplayer snake"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tomiwa Adesanya", email = "a.tomiwa.tech@gmail.com" }]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.0", "pip-audit==2.10.1", "nuitka"]

# Spelled out, because this is an application in a flat layout rather than a
# library. Without it setuptools scans the project root, finds static/ and
# installer/ sitting beside utils/, and refuses to guess which of them is the
# package. The editable install then fails before it has installed anything,
# which is what CI hit on its first run.
[tool.setuptools]
packages = ["utils", "utils.game", "utils.net", "utils.store"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["static", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

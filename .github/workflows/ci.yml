name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The minimum this project declares in pyproject.toml. Testing on the
          # oldest supported version is what catches a newer syntax slipping in.
          python-version: "3.10"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        # No display is needed. pywebview is imported inside the function that
        # opens the window, so nothing under tests/ ever reaches it, and the
        # suite binds only to loopback.
        run: pytest -q

      - name: Lint
        run: ruff check .

      - name: Repository rules
        # Pure ASCII everywhere, and the game name in one file only. This is
        # the same script the pre-commit hook runs, so a contributor who never
        # installed the hook is still caught here.
        run: python tools/check_ascii.py
